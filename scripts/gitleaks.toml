title = "Project secret detection"

[extend]
useDefault = true

# A public storage migration identifier, not a credential / 公開された保存形式の移行ID。
# Match the exact value AND file only; other keys in this file remain scanned.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Non-secret storage migration identifier in settings.ts"
condition = "AND"
regexTarget = "secret"
regexes = ['''^fceDanmakuDefaultsV2$''']
paths = ['''(^|[\\/])src[\\/]shared[\\/]settings\.ts$''']
