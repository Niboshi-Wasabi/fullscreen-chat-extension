<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fullscreen Chat</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="fce-ext-chat">
    <header class="fce-ext-chat-header" id="header">Fullscreen Chat</header>
    <div
      class="fce-ext-chat-list"
      id="list"
      role="log"
      aria-live="polite"
    ></div>
    <form class="fce-ext-chat-compose" id="compose">
      <textarea id="input" rows="2" maxlength="500"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
